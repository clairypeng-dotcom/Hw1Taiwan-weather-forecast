<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="weather-icon">
  <defs>
    <radialGradient id="sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="80%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </radialGradient>
    <filter id="sun-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Sun Rays -->
  <g stroke="#F59E0B" stroke-width="3" stroke-linecap="round" opacity="0.85">
    <line x1="32" y1="6" x2="32" y2="12" />
    <line x1="32" y1="52" x2="32" y2="58" />
    <line x1="6" y1="32" x2="12" y2="32" />
    <line x1="52" y1="32" x2="58" y2="32" />
    <line x1="13.6" y1="13.6" x2="17.9" y2="17.9" />
    <line x1="46.1" y1="46.1" x2="50.4" y2="50.4" />
    <line x1="13.6" y1="50.4" x2="17.9" y2="46.1" />
    <line x1="46.1" y1="17.9" x2="50.4" y2="13.6" />
  </g>
  <!-- Sun Body -->
  <circle cx="32" cy="32" r="14" fill="url(#sun-grad)" filter="url(#sun-glow)" />
</svg>
