<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="weather-icon">
  <defs>
    <radialGradient id="pc-sun-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="80%" stop-color="#F59E0B" />
    </radialGradient>
    <linearGradient id="cloud-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
    <filter id="cloud-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>
  <!-- Background Sun -->
  <g transform="translate(18, 14)">
    <circle cx="16" cy="12" r="10" fill="url(#pc-sun-grad)" />
    <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" opacity="0.8">
      <line x1="16" y1="-2" x2="16" y2="2" />
      <line x1="16" y1="22" x2="16" y2="26" />
      <line x1="2" y1="12" x2="-2" y2="12" />
      <line x1="30" y1="12" x2="34" y2="12" />
      <line x1="3.3" y1="-0.7" x2="6.1" y2="2.1" />
      <line x1="25.9" y1="21.9" x2="28.7" y2="24.7" />
      <line x1="28.7" y1="-0.7" x2="25.9" y2="2.1" />
      <line x1="6.1" y1="21.9" x2="3.3" y2="24.7" />
    </g>
  </g>
  <!-- Foreground Cloud -->
  <path d="M22 48h22a10 10 0 0 0 0-20 13.5 13.5 0 0 0-26-4 9.5 9.5 0 0 0-4 18 10 10 0 0 0 8 6z" 
        fill="url(#cloud-grad)" filter="url(#cloud-shadow)" />
</svg>
