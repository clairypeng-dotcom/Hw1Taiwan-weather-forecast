<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" class="weather-icon">
  <defs>
    <linearGradient id="ts-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="ts-bolt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#EAB308" />
    </linearGradient>
    <filter id="bolt-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FACC15" flood-opacity="0.8" />
    </filter>
  </defs>
  <!-- Cloud -->
  <path d="M18 36h24a10 10 0 0 0 0-20 14 14 0 0 0-27-4 10 10 0 0 0-4 18 10 10 0 0 0 7 6z" 
        fill="url(#ts-cloud)" />
  <!-- Lightning Bolt -->
  <polygon points="34,34 26,46 32,46 28,58 40,44 34,44" fill="url(#ts-bolt)" filter="url(#bolt-glow)" />
  <!-- Rain drops -->
  <line x1="20" y1="44" x2="17" y2="52" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="44" y1="44" x2="41" y2="52" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
</svg>
