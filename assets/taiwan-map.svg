<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 700" class="taiwan-map-svg" id="taiwan-map-svg">
  <defs>
    <!-- Map Gradients and Filters -->
    <linearGradient id="map-bg-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.1" />
    </linearGradient>
    <filter id="county-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284C7" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Offshore Islands Containers (Insets) -->
  <g class="island-insets" id="island-insets">
    <!-- Matsu (Lienchiang) Inset Box -->
    <g class="island-box" id="inset-lienchiang">
      <rect x="25" y="30" width="110" height="75" rx="8" class="inset-border" />
      <text x="35" y="48" class="inset-title">連江縣 (馬祖)</text>
      <!-- Matsu Islands paths -->
      <path id="county-lienchiang" data-id="lienchiang" data-name="連江縣" class="county-path island-path"
            d="M 60,62 Q 65,58 72,60 Q 75,65 70,68 Q 62,68 60,62 Z 
               M 82,72 Q 87,68 93,70 Q 95,76 90,78 Q 84,77 82,72 Z
               M 42,66 Q 47,62 52,65 Q 50,71 45,70 Q 40,69 42,66 Z
               M 98,54 Q 102,51 106,53 Q 107,57 103,58 Q 99,57 98,54 Z" />
    </g>

    <!-- Kinmen Inset Box -->
    <g class="island-box" id="inset-kinmen">
      <rect x="25" y="115" width="110" height="85" rx="8" class="inset-border" />
      <text x="35" y="133" class="inset-title">金門縣</text>
      <!-- Kinmen Islands paths -->
      <path id="county-kinmen" data-id="kinmen" data-name="金門縣" class="county-path island-path"
            d="M 50,165 Q 60,150 78,155 Q 92,148 108,158 Q 112,168 102,176 Q 85,170 75,182 Q 62,178 50,165 Z 
               M 35,170 Q 42,166 45,172 Q 43,180 37,178 Q 33,175 35,170 Z" />
    </g>

    <!-- Penghu Inset Box -->
    <g class="island-box" id="inset-penghu">
      <rect x="25" y="210" width="110" height="110" rx="8" class="inset-border" />
      <text x="35" y="228" class="inset-title">澎湖縣</text>
      <!-- Penghu Islands paths -->
      <path id="county-penghu" data-id="penghu" data-name="澎湖縣" class="county-path island-path"
            d="M 68,245 Q 78,240 82,250 Q 80,265 88,272 Q 82,285 75,278 Q 72,265 65,260 Q 64,250 68,245 Z 
               M 55,272 Q 62,268 64,275 Q 60,285 55,282 Q 52,277 55,272 Z 
               M 88,240 Q 94,238 96,244 Q 92,250 87,246 Q 86,242 88,240 Z 
               M 72,298 Q 78,295 80,302 Q 76,308 71,305 Q 69,301 72,298 Z" />
    </g>
  </g>

